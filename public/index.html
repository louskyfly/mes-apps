<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes apps">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0a0a0c;
    --card:#151519;
    --card-press:#1f1f25;
    --stroke:#26262e;
    --fg:#f4f4f6;
    --muted:#7d7d8a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust:100%;
  }

  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    background:
      radial-gradient(140% 55% at 50% -15%, #111118 0%, rgba(10,10,12,0) 68%),
      var(--bg);
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none;
  }

  /* ---------- en-tête ---------- */

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    width:100%;
    margin:0 auto 22px;
    max-width:760px;
  }

  h1{
    margin:0;
    font-size:1.55rem;
    font-weight:650;
    letter-spacing:-0.02em;
  }

  .clock{
    font-size:0.85rem;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- grille ---------- */

  .grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:12px;
    width:100%;
    margin:clamp(16px, 8vh, 72px) auto 0;
    max-width:760px;
  }

  @media (min-width:620px){ .grid{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
  @media (min-width:900px){ .grid{ grid-template-columns:repeat(5, minmax(0,1fr)); } }

  .tile{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:11px;
    aspect-ratio:1 / 1;
    padding:14px 10px;
    border:1px solid var(--stroke);
    border-radius:22px;
    background:var(--card);
    color:var(--fg);
    text-decoration:none;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }

  .tile:active{
    transform:scale(.965);
    background:var(--card-press);
    border-color:#34343f;
  }

  .tile svg, .tile .letter{
    width:46px;
    height:46px;
    flex:none;
  }

  .tile .letter{
    display:grid;
    place-items:center;
    border-radius:12px;
    background:#22222a;
    font-size:1.25rem;
    font-weight:600;
  }

  .tile span.name{
    font-size:0.9rem;
    font-weight:520;
    line-height:1.2;
    text-align:center;
    overflow-wrap:anywhere;
  }

  /* ---------- pied ---------- */

  footer{
    margin:auto auto 0;
    padding-top:40px;
    max-width:760px;
    font-size:0.8rem;
    line-height:1.5;
    color:var(--muted);
    text-align:center;
  }

  footer b{ color:#a9a9b8; font-weight:560; }

  @media (prefers-reduced-motion:reduce){
    .tile{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <h1>Mes apps</h1>
  <div class="clock" id="clock"></div>
</header>

<nav class="grid" id="grid"></nav>

<footer>
  <b>Safari → Partager → Sur l'écran d'accueil</b><br>
  pour l'avoir comme une app.
</footer>

<script>
/* ============================================================
   LA LISTE DES APPS
   Pour ajouter une app : copie une ligne et change name + url.
   Pour en retirer une : supprime la ligne.
   ============================================================ */

const ICONS = {
  youtube: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="1.6" y="4.6" width="20.8" height="14.8" rx="4.6" fill="#FF0033"/>
    <path d="M10 8.9l6.1 3.1-6.1 3.1z" fill="#fff"/>
  </svg>`,

  anydesk: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="5.4" fill="#EF0000"/>
    <path d="M12 5.9l5.7 11.6h-3.35L12 12.1l-2.35 5.4H6.3z" fill="#fff"/>
  </svg>`,

  opencode: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="5.4" fill="#131316" stroke="#2e2e38" stroke-width="1"/>
    <path d="M6.9 8.4l3.5 3.6-3.5 3.6" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12.6 15.6h4.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
  </svg>`,

  arc: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="arcGrad" x1="0" y1="24" x2="24" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FF5C8A"/>
        <stop offset=".5" stop-color="#8B5CFF"/>
        <stop offset="1" stop-color="#37C6FF"/>
      </linearGradient>
    </defs>
    <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="5.6" fill="url(#arcGrad)"/>
    <path d="M6.6 16.9a5.6 5.6 0 019.9-3.6" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
    <circle cx="16.5" cy="15.1" r="1.5" fill="#fff"/>
  </svg>`,

  web: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="9.4" stroke="#8f8f9e" stroke-width="1.7"/>
    <ellipse cx="12" cy="12" rx="4.1" ry="9.4" stroke="#8f8f9e" stroke-width="1.7"/>
    <path d="M3 12h18" stroke="#8f8f9e" stroke-width="1.7"/>
  </svg>`
};

const APPS = [
  { name: "YouTube",  url: "https://www.youtube.com/",  icon: "youtube"  },
  { name: "AnyDesk",  url: "https://anydesk.com/fr",    icon: "anydesk"  },
  { name: "OpenCode", url: "https://opencode.ai/",      icon: "opencode" },
  { name: "Arc",      url: "https://arc.net/",          icon: "arc"      },
];

/* ============================================================
   Rendu (pas besoin d'y toucher)
   ============================================================ */

const grid = document.getElementById("grid");

for (const app of APPS) {
  if (!app.url) continue;

  const a = document.createElement("a");
  a.className = "tile";
  a.href = app.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", app.name);

  a.innerHTML = ICONS[app.icon] || `<div class="letter">${app.name.slice(0, 1)}</div>`;

  const label = document.createElement("span");
  label.className = "name";
  label.textContent = app.name;
  a.appendChild(label);

  grid.appendChild(a);
}

/* petite horloge, pour que ça ressemble à un vrai lanceur */
const clock = document.getElementById("clock");

function tick() {
  clock.textContent = new Date().toLocaleTimeString("fr-FR", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

tick();
setInterval(tick, 10000);
</script>
</body>
</html>
