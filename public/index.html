<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes apps">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0a0a0c;
    --card:#151519;
    --card-press:#1f1f25;
    --stroke:#26262e;
    --fg:#f4f4f6;
    --muted:#7d7d8a;
    --bar:#101014;
  }

  *{ box-sizing:border-box; }

  [hidden]{ display:none !important; }

  :focus-visible{ outline:2px solid #6ea8ff; outline-offset:3px; }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }

  body{
    display:flex;
    flex-direction:column;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    background:
      radial-gradient(140% 55% at 50% -15%, #111118 0%, rgba(10,10,12,0) 68%),
      var(--bg);
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none;
  }

  /* ---------- en-tête ---------- */

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    width:100%;
    margin:0 auto 22px;
    max-width:760px;
  }

  h1{
    margin:0;
    font-size:1.55rem;
    font-weight:650;
    letter-spacing:-0.02em;
  }

  .clock{
    font-size:0.85rem;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- grille ---------- */

  .grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:12px;
    width:100%;
    margin:clamp(16px, 8vh, 72px) auto 0;
    max-width:760px;
  }

  @media (min-width:620px){ .grid{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
  @media (min-width:900px){ .grid{ grid-template-columns:repeat(5, minmax(0,1fr)); } }

  .tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:11px;
    aspect-ratio:1 / 1;
    padding:14px 10px;
    border:1px solid var(--stroke);
    border-radius:22px;
    background:var(--card);
    color:var(--fg);
    font:inherit;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }

  .tile:active{
    transform:scale(.965);
    background:var(--card-press);
    border-color:#34343f;
  }

  .tile svg, .tile .letter{
    width:46px;
    height:46px;
    flex:none;
  }

  .tile .letter{
    display:grid;
    place-items:center;
    border-radius:12px;
    background:#22222a;
    font-size:1.25rem;
    font-weight:600;
  }

  .tile span.name{
    font-size:0.9rem;
    font-weight:520;
    line-height:1.2;
    text-align:center;
    overflow-wrap:anywhere;
  }

  footer{
    margin:auto auto 0;
    padding-top:40px;
    max-width:760px;
    font-size:0.8rem;
    line-height:1.5;
    color:var(--muted);
    text-align:center;
  }

  footer b{ color:#a9a9b8; font-weight:560; }

  /* ---------- lecteur intégré ---------- */

  #viewer{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    transform:translateX(100%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);
    visibility:hidden;
  }

  #viewer.open{
    transform:none;
    visibility:visible;
  }

  .bar{
    display:flex;
    align-items:center;
    gap:10px;
    flex:none;
    padding:
      calc(8px + env(safe-area-inset-top))
      calc(10px + env(safe-area-inset-right))
      8px
      calc(10px + env(safe-area-inset-left));
    background:var(--bar);
    border-bottom:1px solid var(--stroke);
  }

  .btn{
    display:grid;
    place-items:center;
    width:36px;
    height:36px;
    flex:none;
    border:0;
    border-radius:10px;
    background:#1c1c22;
    color:var(--fg);
    font-size:1.1rem;
    text-decoration:none;
    cursor:pointer;
  }

  .btn:active{ background:#2a2a33; }

  .bar .title{
    flex:1;
    min-width:0;
    font-size:0.95rem;
    font-weight:560;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:center;
  }

  #frame{
    flex:1;
    width:100%;
    border:0;
    background:#fff;
  }

  /* message "ce site refuse l'affichage intégré" */

  .note{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:32px 28px calc(32px + env(safe-area-inset-bottom));
    text-align:center;
    overflow-y:auto;
  }

  .note svg, .note .letter{ width:56px; height:56px; }

  .note .letter{
    display:grid;
    place-items:center;
    border-radius:14px;
    background:#22222a;
    font-size:1.5rem;
    font-weight:600;
  }

  .note h2{
    margin:0;
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  .note p{
    margin:0;
    max-width:34ch;
    font-size:0.92rem;
    line-height:1.55;
    color:var(--muted);
  }

  .note code{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:0.85em;
    color:#b9b9c8;
    background:#1c1c22;
    padding:2px 6px;
    border-radius:6px;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    max-width:320px;
    margin-top:8px;
  }

  .primary{
    display:block;
    padding:14px 18px;
    border-radius:14px;
    background:#f4f4f6;
    color:#0a0a0c;
    font-size:0.95rem;
    font-weight:600;
    text-decoration:none;
    text-align:center;
  }

  .secondary{
    display:block;
    padding:13px 18px;
    border:1px solid var(--stroke);
    border-radius:14px;
    background:transparent;
    color:var(--fg);
    font:inherit;
    font-size:0.95rem;
    text-align:center;
    cursor:pointer;
  }

  @media (prefers-reduced-motion:reduce){
    .tile{ transition:none; }
    #viewer{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <h1>Mes apps</h1>
  <div class="clock" id="clock"></div>
</header>

<nav class="grid" id="grid"></nav>

<footer>
  <b>Safari → Partager → Sur l'écran d'accueil</b><br>
  pour l'avoir comme une app.
</footer>

<!-- ================= lecteur intégré ================= -->

<section id="viewer" aria-hidden="true">
  <div class="bar">
    <button class="btn" id="back" type="button" aria-label="Retour">‹</button>
    <span class="title" id="vtitle"></span>
    <a class="btn" id="vopen" href="#" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir dans Safari">↗</a>
  </div>

  <iframe id="frame" title="" referrerpolicy="no-referrer" hidden></iframe>

  <div class="note" id="vnote" hidden>
    <div id="vicon"></div>
    <h2 id="vname"></h2>
    <p id="vwhy"></p>
    <div class="actions">
      <a class="primary" id="vgo" href="#" target="_blank" rel="noopener noreferrer">Ouvrir dans un onglet</a>
      <button class="secondary" id="vback2" type="button">Retour aux apps</button>
    </div>
  </div>
</section>

<script>
/* ============================================================
   LA LISTE DES APPS
   embed: true  -> le site s'affiche DANS la page
   embed: false -> le site interdit l'affichage intégré,
                   un message s'affiche dans la page
   ============================================================ */

const ICONS = {
  youtube: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="1.6" y="4.6" width="20.8" height="14.8" rx="4.6" fill="#FF0033"/>
    <path d="M10 8.9l6.1 3.1-6.1 3.1z" fill="#fff"/>
  </svg>`,

  anydesk: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="5.4" fill="#EF0000"/>
    <path d="M12 5.9l5.7 11.6h-3.35L12 12.1l-2.35 5.4H6.3z" fill="#fff"/>
  </svg>`,

  whatsapp: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="5.6" fill="#25D366"/>
    <path d="M12 5.6a6.2 6.2 0 00-5.3 9.4l-.9 3.5 3.6-.9A6.2 6.2 0 1012 5.6z" fill="#fff"/>
    <path d="M9.9 8.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5 0-.7.3-.2.3-.8.8-.8 2s.8 2.3 1 2.5c.2.2 1.6 2.5 3.9 3.4 1.9.7 2.3.6 2.7.5.4 0 1.3-.5 1.5-1.1.2-.5.2-1 .1-1.1 0-.1-.2-.2-.4-.3l-1.4-.7c-.2-.1-.3-.1-.5.1l-.6.8c-.1.2-.3.2-.5.1-.7-.3-1.2-.6-1.7-1.1-.4-.4-.8-.9-1-1.4-.1-.2 0-.3.1-.4l.4-.5c.1-.2.1-.3 0-.5z" fill="#25D366"/>
  </svg>`,

  instagram: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="igGrad" x1="0" y1="24" x2="24" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FEDA75"/>
        <stop offset=".3" stop-color="#FA7E1E"/>
        <stop offset=".6" stop-color="#D62976"/>
        <stop offset="1" stop-color="#962FBF"/>
      </linearGradient>
    </defs>
    <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="6" fill="url(#igGrad)"/>
    <rect x="6.1" y="6.1" width="11.8" height="11.8" rx="3.7" stroke="#fff" stroke-width="1.7"/>
    <circle cx="12" cy="12" r="2.9" stroke="#fff" stroke-width="1.7"/>
    <circle cx="16.1" cy="7.9" r="1.05" fill="#fff"/>
  </svg>`,

  web: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="9.4" stroke="#8f8f9e" stroke-width="1.7"/>
    <ellipse cx="12" cy="12" rx="4.1" ry="9.4" stroke="#8f8f9e" stroke-width="1.7"/>
    <path d="M3 12h18" stroke="#8f8f9e" stroke-width="1.7"/>
  </svg>`
};

const APPS = [
  { name: "YouTube",   url: "https://www.youtube.com/",     icon: "youtube",   embed: false },
  { name: "AnyDesk",   url: "https://anydesk.com/fr",       icon: "anydesk",   embed: false },
  { name: "WhatsApp",  url: "https://web.whatsapp.com/",    icon: "whatsapp",  embed: false },
  { name: "Instagram", url: "https://www.instagram.com/",   icon: "instagram", embed: false },
];

/* ============================================================
   Rendu (pas besoin d'y toucher)
   ============================================================ */

const grid    = document.getElementById("grid");
const viewer  = document.getElementById("viewer");
const frame   = document.getElementById("frame");
const vnote   = document.getElementById("vnote");
const vtitle  = document.getElementById("vtitle");
const vopen   = document.getElementById("vopen");

function iconFor(app){
  return ICONS[app.icon] || `<div class="letter">${app.name.slice(0, 1)}</div>`;
}

/* --- tuiles --- */

for (const app of APPS) {
  const tile = document.createElement("button");
  tile.type = "button";
  tile.className = "tile";
  tile.setAttribute("aria-label", app.name);
  tile.innerHTML = iconFor(app);

  const label = document.createElement("span");
  label.className = "name";
  label.textContent = app.name;
  tile.appendChild(label);

  tile.addEventListener("click", () => openApp(app));
  grid.appendChild(tile);
}

/* --- ouverture dans la page --- */

let current = null;

function openApp(app){
  current = app;

  vtitle.textContent = app.name;
  vopen.href = app.url;
  vopen.setAttribute("aria-label", "Ouvrir " + app.name + " dans Safari");

  if (app.embed) {
    vnote.hidden = true;
    frame.hidden = false;
    frame.title = app.name;
    frame.src = app.url;
  } else {
    frame.hidden = true;
    frame.removeAttribute("src");
    vnote.hidden = false;

    document.getElementById("vicon").innerHTML = iconFor(app);
    document.getElementById("vname").textContent = app.name;
    document.getElementById("vwhy").innerHTML =
      "Ce site interdit l'affichage dans une page " +
      "(en-tête <code>X-Frame-Options: SAMEORIGIN</code>). " +
      "Le navigateur bloque, aucune page web ne peut passer outre.";
    document.getElementById("vgo").href = app.url;
  }

  viewer.classList.add("open");
  viewer.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeApp(){
  current = null;
  viewer.classList.remove("open");
  viewer.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";

  /* on vide l'iframe après la transition, pour couper le son / la vidéo */
  setTimeout(() => {
    if (!viewer.classList.contains("open")) {
      frame.removeAttribute("src");
      frame.hidden = true;
      vnote.hidden = true;
    }
  }, 300);
}

document.getElementById("back").addEventListener("click", closeApp);
document.getElementById("vback2").addEventListener("click", closeApp);

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && current) closeApp();
});

/* --- horloge --- */

const clock = document.getElementById("clock");

function tick(){
  clock.textContent = new Date().toLocaleTimeString("fr-FR", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

tick();
setInterval(tick, 10000);
</script>
</body>
</html>
